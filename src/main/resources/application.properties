spring.application.name=demo
server.port=8080

# СР2: файлова база H2 (каталог data відносно робочої директорії застосунку)
spring.datasource.url=jdbc:h2:file:./data/cameradb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console — лише для локального навчання
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# шлях зовнішнього списку камер (базова адреса Feign-клієнта — https://dummyjson.com/c)
camera.api.list-path=/da8f-feef-4b02-9ca0

spring.cloud.openfeign.client.config.camera-client.connectTimeout=10000
spring.cloud.openfeign.client.config.camera-client.readTimeout=20000
